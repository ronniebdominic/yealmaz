<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E9F6E" />
    <meta name="description" content="Ye-Almaz Dental Laboratory — Clinic Portal" />

    <!-- PWA meta tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ye-Almaz" />

    <!-- Apple touch icon (Safari "Add to Home Screen") -->
    <link rel="apple-touch-icon" href="/assets/icon.png" />

    <title>Ye-Almaz Clinic</title>

    <!-- Sora — matches src/utils/theme.js's Typography font family names -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      html, body, #root, [class*="css-text"], [class*="css-view"] {
        font-family: 'Sora', -apple-system, sans-serif !important;
      }
    </style>

    <!-- Expo injects bundle here -->
    %FAVICON%
    %EXPO_WEB_LINKS%
  </head>
  <body>
    <div id="root"></div>
    %EXPO_WEB_SCRIPTS%

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js')
            .then(function (reg) {
              console.log('[SW] Registered. Scope:', reg.scope);

              // Notify user when a new version is available
              reg.addEventListener('updatefound', function () {
                var newWorker = reg.installing;
                newWorker.addEventListener('statechange', function () {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[SW] New version available — reload to update.');
                  }
                });
              });
            })
            .catch(function (err) {
              console.warn('[SW] Registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>

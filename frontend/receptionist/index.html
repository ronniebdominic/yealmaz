<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F2044" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ye-Almaz Lab" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      /* Apply the saved theme before first paint so there is no flash. Mirrors utils/theme.js. */
      (function () {
        try {
          var t = localStorage.getItem('ya_theme');
          if (t === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#EEF2F8');
          }
        } catch (e) {}
      })();
    </script>
    <title>Ye-Almaz Dental Lab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
